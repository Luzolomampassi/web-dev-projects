<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="760" height="220" viewBox="0 0 760 220">
  <title>Sabor &amp; Artes Restaurante</title>
  <desc>Logotipo com fundo transparente.</desc>

  <!-- Fundo transparente: nenhum elemento de fundo é desenhado -->

  <g text-anchor="middle">
    <!-- Nome principal -->
    <text x="380" y="96"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="72"
          font-weight="700"
          letter-spacing="-3"
          fill="#123C35">
      Sabor <tspan fill="#B88A45"
                   font-family="Georgia, 'Times New Roman', serif"
                   font-size="78"
                   font-weight="400"
                   font-style="italic">&amp;</tspan> <tspan fill="#123C35">Artes</tspan>
    </text>

    <!-- Subtítulo -->
    <text x="380" y="145"
          font-family="Arial, Helvetica, sans-serif"
          font-size="16"
          font-weight="700"
          letter-spacing="6"
          fill="#123C35">
      RESTAURANTE
    </text>
  </g>
</svg>
